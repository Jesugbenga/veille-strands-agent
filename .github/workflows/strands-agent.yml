name: Strands back-office concierge

# Runs the autonomous Strands agent on a schedule (and on demand). It reviews
# the last 24h of Veille calls/bookings and writes staff tasks to Supabase.
on:
  schedule:
    - cron: "0 13 * * *" # 13:00 UTC daily (~6am PT) — morning review
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VEILLE_BUSINESS_ID: ${{ secrets.VEILLE_BUSINESS_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      BEDROCK_MODEL_ID: ${{ secrets.BEDROCK_MODEL_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run concierge
        run: python agent.py
